apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "91.8.2"
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        # EKS runs these control plane parts for you and doesn't expose their metrics. Leaving them on just creates alerts that fire forever
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 3d
            # Pick up service monitors and rules from any namespace, not just ones labelled for this helm release
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits: memory 1Gi

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

        grafana:
          admin:
            existingSecret: grafana-admin
          sidecar:
            dashboards:
              # load dashboards from config maps in every namespace
              searchNamespace: ALL

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # the chart's admission jobs fill in the webhook tls cert after install.
  # ignore that field, or argocd sees it as drift and re-syncs forever
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # the charts crds are too big for a normal kubectl apply
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
