apiVersion: apps/v1
kind: Deployment
metadata:
  name: fxwatch-redis
  labels:
    {{- include "fxwatch.labels" . | nindent 4 }}
    app.kubernetes.io/name: fxwatch-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fxwatch-redis
  template:
    metadata:
      labels:
        {{- include "fxwatch.labels" . | nindent 8 }}
        app.kubernetes.io/name: fxwatch-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999      # "redis" user in the official image
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Pure cache: no persistence, evict least-recently-used keys when full
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ .Values.redis.maxMemory | quote }}
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- include "fxwatch.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fxwatch-redis
  labels:
    {{- include "fxwatch.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: fxwatch-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis