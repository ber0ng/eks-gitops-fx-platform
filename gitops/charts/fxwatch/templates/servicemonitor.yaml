{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fxwatch-api
  labels:
    {{- include "fxwatch.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fxwatch-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}