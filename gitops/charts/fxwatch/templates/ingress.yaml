{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fxwatch
  labels:
    {{- include "fxwatch.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Send traffic straight to pod IPs (skips the extra node hop)
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fxwatch-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fxwatch-frontend
                port:
                  name: http
{{- end }}