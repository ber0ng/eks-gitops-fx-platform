server {
    listen 8080:
    root /usr/share/nginx/html;
    index index.html;

    # spa : unknown paths fallback to the index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite puts a content hash in asset filenames, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache_Control "public, immutable";
    }

    # always fetch the latest index.html so new deploys show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # health check for k8s and the alb
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}