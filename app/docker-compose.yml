services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fxwatch
      POSTGRES_PASSWORD: fxwatch
      POSTGRES_DB: fxwatch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxwatch"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: api
    environment: &app-env
      PGHOST: postgres
      PGUSER: fxwatch
      PGPASSWORD: fxwatch
      PGDATABASE: fxwatch
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: worker
    environment: *app-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
