version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /app/backend
    schedule:
      interval: weekly
    groups:
      backend-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
    groups:
      frontend-deps:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/app/backend", "/app/frontend"]
    schedule:
      interval: weekly
